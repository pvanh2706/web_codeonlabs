<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOn Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }
        .hero-section {
            background-color: #007bff;
            color: white;
            border-radius: 10px;
            padding: 30px;
            text-align: center;
        }
        .image-section img {
            border-radius: 50%;
            max-width: 80%;
            height: auto;
        }
        @media (max-width: 768px) {
            .hero-section {
                padding: 20px;
            }
            .image-section img {
                max-width: 60%;
            }
        }
    </style>
</head>
<body>
    <div class="container d-flex flex-column justify-content-center align-items-center min-vh-100">
        <div class="container p-4">
            <div class="row align-items-center flex-column-reverse flex-md-row">
                <div class="col-md-6 hero-section">
                    <h1 class="fw-bold">Hãy để</h1>
                    <h2 class="fw-bold">CodeOn Labs</h2>
                    <p class="mt-2 fs-5">
                        giúp bạn tạo ra Website giá rẻ, phù hợp và tăng doanh thu cho doanh nghiệp của bạn.
                    </p>
                </div>
                <div class="col-md-6 text-center mb-3 mb-md-0">
                    <img src="https://storage.googleapis.com/a1aa/image/wtlVYwOS651Wk8jgOHwL2dOiwElw66fe_DXDNyuOVe0.jpg" 
                         alt="A person smiling and holding a geometric structure" 
                         class="img-fluid image-section" width="300">
                </div>
            </div>
            <div class="row align-items-center mt-4 flex-column flex-md-row">
                <div class="col-md-6 text-center mb-3 mb-md-0">
                    <img src="https://storage.googleapis.com/a1aa/image/GY0tMGRzYkPbks-8SBw5_qUsu2lTeMj6kQtP9TtRpCc.jpg" 
                         alt="A person holding a magnifying glass" 
                         class="img-fluid rounded" width="300">
                </div>
                <div class="col-md-6 hero-section">
                    <h2 class="fw-bold">Quy trình thiết kế website</h2>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
