<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao diện Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .circle-number {
            width: 32px;
            height: 32px;
            aspect-ratio: 1 / 1;
            border: 2px solid #007bff; /* Viền màu xanh */
            border-radius: 50%; /* Hình tròn */
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #007bff;
            position: relative;
        }

        .circle-number::after {
            content: "";
            width: 20px;
            height: 2px;
            background-color: #007bff;
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

<div class="container mt-4">
    <div class="d-flex align-items-center">
        <!-- Số 1 trong vòng tròn -->
        <div class="circle-number">1</div>
        <!-- Tiêu đề -->
        <h5 class="ms-2 fw-bold">Tại sao quảng cáo thương hiệu lại quan trọng</h5>
    </div>
</div>

</body>
</html>
