<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giá Trị Cốt Lõi</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #ffffff;
        }

        .container-custom {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 30px;
        }

        .grid-item {
            border: 2px solid #0d6efd;
            padding: 15px;
            border-radius: 8px;
            font-weight: bold;
            background-color: #f8fafc;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container container-custom text-center">
        <div class="row align-items-center">
            <div class="col-md-6 text-md-start text-center">
                <h1 class="fw-bold text-dark">GIÁ TRỊ</h1>
                <h2 class="fw-bold text-primary">CỐT LÕI</h2>
                <p class="fs-5 text-muted mt-3">
                    Giá trị cốt lõi là kim chỉ nam cho công ty chúng tôi
                </p>
            </div>
            <div class="col-md-6 text-center">
                <img src="img/banner-dich-vu.png" alt="Banner" class="img-fluid rounded">
            </div>
        </div>

        <!-- Grid giá trị cốt lõi -->
        <div class="grid-container">
            <div class="grid-item">SÁNG TẠO</div>
            <div class="grid-item">BẢO MẬT</div>
            <div class="grid-item">TỐC ĐỘ</div>
            <div class="grid-item">CAM KẾT</div>
            <div class="grid-item">KHÁCH HÀNG LÀ TRUNG TÂM</div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
