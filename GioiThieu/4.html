<html>
 <head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      background-color: #ffffff;
    }
    .custom-container {
      max-width: 800px;
      margin: 0 auto;
      padding: 20px;
      text-align: center;
    }
    .custom-image {
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      margin-top: 16px;
    }
    .custom-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin-top: 24px;
    }
    .custom-card {
      border: 2px solid #2563eb;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      background-color: #f8fafc;
    }
    .custom-card.blue {
      background-color: #2563eb;
      color: white;
    }
  </style>
 </head>
 <body>
  <div class="custom-container">
    <h1 class="text-3xl font-bold">GIÁ TRỊ</h1>
    <h2 class="text-3xl font-bold text-blue-600">CỐT LÕI</h2>
    <p class="text-lg mt-2">Giá trị cốt lõi là kim chỉ nam cho công ty chúng tôi</p>

    <img class="custom-image" src="https://storage.googleapis.com/a1aa/image/qmIw4teYU26bu7rw8aYB47TAdyv3YrFmy72YElOkjU0.jpg" alt="A group of diverse people"/>

    <div class="custom-grid">
      <div class="custom-card">SÁNG TẠO</div>
      <div class="custom-card blue">BẢO MẬT</div>
      <div class="custom-card">TỐC ĐỘ</div>
      <div class="custom-card blue">CAM KẾT</div>
      <div class="custom-card">KHÁCH HÀNG LÀ TRUNG TÂM</div>
    </div>
  </div>
 </body>
</html>
