<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giới thiệu - Tầm Nhìn</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        .text-primary {
            color: #1665d8; /* Màu xanh thương hiệu */
        }

        .shadow-lg {
            box-shadow: 0px 10px 30px rgba(0, 0, 0, 0.1); /* Đổ bóng nhẹ cho ảnh */
        }

        .fw-bold {
            font-weight: bold;
        }

        .fs-5 {
            font-size: 1.2rem;
        }

        .text-muted {
            color: #666;
        }

        /* Giữ CODEON LABS bên trái */
        .company-name {
            float: left;
        }

        @media (max-width: 768px) {
            .row {
                text-align: center;
            }

            .company-name {
                float: none;
                text-align: center;
            }
        }
    </style>
</head>
<body>

    <div class="container py-5">
        <div class="row">
            <!-- Cột chứa tiêu đề -->
            <div class="col-md-6 torder-1 order-md-0">
                <h1 class="fw-bold text-dark">TẦM NHÌN</h1>
            </div>
            <!-- Cột chứa nội dung -->
            <div class="col-md-6 text-right">
                <p class="fs-5 text-muted">
                    Chúng tôi khát khao trở thành công ty công nghệ đứng đầu Việt Nam, khẳng định vị thế trong nước cũng như thị trường quốc tế.
                </p>
            </div>
        </div>

        <!-- Tên công ty, giữ nguyên vị trí bên trái -->
        <div class="row">
            <h2 class="fw-bold text-primary company-name">CODEON LABS</h2>
        </div>

        <!-- Hình ảnh -->
        <div class="text-center mt-4">
            <img src="img/contact-tam-nhin.png" alt="Tầm Nhìn" class="img-fluid rounded shadow-lg">
        </div>
    </div>

</body>
</html>
