<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Giới Thiệu Codeon Labs
  </title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <style>
    .custom-container {
      max-width: 1024px;
      margin: 0 auto;
      padding: 16px;
    }
    .custom-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
    }
    @media (min-width: 768px) {
      .custom-grid {
        grid-template-columns: 1fr 1fr;
      }
    }
    .custom-image-wrapper {
      position: relative;
      width: 100%;
      height: 400px;
    }
    .custom-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    .custom-image-overlay {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }
    .custom-text {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
  </style>
 </head>
 <body class="bg-white">
  <div class="container custom-container">
   <div class="custom-grid">
    <div class="custom-image-wrapper">
     <img alt="A woman in a yellow jacket with a colorful geometric background" class="custom-image" height="400" src="https://storage.googleapis.com/a1aa/image/Co6dsThd_hJCS4gO13We_nmVD6Ebo-HgE_fsJo-WcO4.jpg" width="400"/>
     <img alt="A woman in a blue jacket and red hat holding notebooks with a yellow background" class="custom-image-overlay" height="400" src="https://storage.googleapis.com/a1aa/image/GIHs-WwfvTlUZ4VR-8IbbfypLpazc9z5sGKh9D-z26A.jpg" width="400"/>
    </div>
    <div class="custom-text">
     <h1 class="text-4xl font-bold text-black">
      GIỚI THIỆU
     </h1>
     <h2 class="text-4xl font-bold text-blue-600">
      CODEON LABS
     </h2>
     <p class="text-lg text-black mt-4">
      Cam kết mang đến những ý tưởng sáng tạo và phù hợp
     </p>
    </div>
   </div>
  </div>
 </body>
</html>
