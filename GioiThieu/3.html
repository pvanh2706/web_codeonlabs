<html>
 <head>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&amp;display=swap" rel="stylesheet"/>
  <style>
    body {
      font-family: 'Roboto', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }
    .custom-container {
      background-color: #2563eb;
      padding: 24px;
      border-radius: 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 90%;
      width: 600px;
    }
    .custom-flex {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .custom-image-wrapper {
      display: flex;
      gap: 10px;
    }
    .custom-image {
      width: 140px;
      height: 140px;
      object-fit: cover;
      border-radius: 8px;
    }
    .custom-text {
      color: white;
      text-align: center;
      margin-top: 16px;
    }
    .custom-title {
      font-size: 28px;
      font-weight: bold;
    }
    .custom-description {
      margin-top: 12px;
      font-size: 16px;
    }

    @media (min-width: 768px) {
      .custom-container {
        flex-direction: row;
        align-items: flex-start;
        width: 700px;
      }
      .custom-flex {
        flex-direction: row;
      }
      .custom-text {
        text-align: left;
        margin-top: 0;
        margin-left: 20px;
      }
    }
  </style>
 </head>
 <body>
  <div class="custom-container">
   <div class="custom-flex">
    <div class="custom-image-wrapper">
      <img alt="A woman in a blue jacket looking to the side" class="custom-image" src="https://storage.googleapis.com/a1aa/image/L29lJ-cJchbI99v89B9H996PD402kUD-M9Zzum-7wjs.jpg"/>
      <img alt="A woman in a blue jacket holding a phone" class="custom-image" src="https://storage.googleapis.com/a1aa/image/8ceOe_LN-8k1LuKzDGcbaB1vRQBbrNk9Z21K4E9RT_8.jpg"/>
    </div>
   </div>
   <div class="custom-text">
    <h1 class="custom-title">
     SỨ MỆNH
    </h1>
    <p class="custom-description">
     CodeOn Labs tiên phong công nghệ mới, phát triển sản phẩm, dịch vụ hữu ích, cung cấp giải pháp AI, Cloud và chuyển đổi số, hướng đến tiêu chuẩn quốc tế.
    </p>
   </div>
  </div>
 </body>
</html>
