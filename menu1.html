<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Menu Bootstrap</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .navbar-custom {
            transition: all 0.4s ease-in-out;
            background-color: white;
            border-radius: 2px;
        }

        .navbar-custom.scrolled {
            box-shadow: 0 1px 1px rgba(0, 0, 0, 0.1);
        }

        .logo-company img {
            width: 100px;
            object-fit: cover;
        }

        .main-menu {
            list-style: none;
            padding: 0;
            margin: 0;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }

        .main-menu li {
            margin-right: 15px;
            font-weight: bold;
        }

        .main-menu li a {
            text-decoration: none;
            color: #000;
            position: relative;
            padding-bottom: 5px;
        }

        .main-menu li a::after {
            content: "";
            position: absolute;
            left: 50%;
            bottom: 0;
            width: 0;
            height: 2px;
            background-color: #007bff;
            transition: all 0.3s ease-in-out;
            transform: translateX(-50%);
        }

        .main-menu li a:hover::after {
            width: 100%;
        }

        .btn-company-phone {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            font-weight: bold;
            border-radius: 50px;
            padding: 10px 20px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .btn-company-phone:hover {
            background: linear-gradient(135deg, #0056b3, #004090);
            box-shadow: 0 6px 10px rgba(0, 0, 0, 0.2);
        }

        .hamburger {
            display: none;
            font-size: 24px;
            color: black;
            background: none;
            border: none;
            cursor: pointer;
        }

        @media (max-width: 992px) {
            .company-phone {
                display: none;
            }
            .main-menu {
                display: none;
                flex-direction: column;
                background: white;
                width: 100%;
                position: absolute;
                top: 100%;
                left: 0;
                box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
                text-align: center;
            }
            .main-menu.show {
                display: flex;
            }
            .hamburger {
                display: block;
                position: absolute;
                right: 15px;
                top: 50%;
                transform: translateY(-50%);
            }
        }
    </style>
</head>
<body>
    <nav class="container py-3 fixed-top navbar-custom" id="navbar">
        <div class="row align-items-center company-banner">
            <div class="col-lg-3 col-md-3 col-6 text-center text-md-start">
                <div class="logo-company">
                    <a href="index.html"><img src="img/logo-company.png" alt="Logo"></a>
                </div>
            </div>
            <div class="col-lg-7 col-md-9 col-6 position-relative">
                <button class="hamburger">☰</button>
                <ul class="main-menu">
                    <li><a href="#" class="active text-uppercase">Trang chủ</a></li>
                    <li><a href="#" class="text-uppercase">Dịch vụ</a></li>
                    <li><a href="#" class="text-uppercase">Tại sao chọn CodeOn Labs?</a></li>
                    <li><a href="#" class="text-uppercase">Blogs</a></li>
                    <li><a href="#" class="text-uppercase">Liên hệ</a></li>
                </ul>
            </div>
            <div class="col-lg-2 col-12 text-center company-phone">
                <a href="tel:0979160564" class="btn btn-company-phone px-4 py-2">0979 160 564</a>
            </div>
        </div>
    </nav>

    <script>
        window.addEventListener('scroll', function() {
            var navbar = document.getElementById('navbar');
            if (window.scrollY > 50) {
                navbar.classList.add('scrolled');
            } else {
                navbar.classList.remove('scrolled');
            }
        });

        document.querySelector('.hamburger').addEventListener('click', function() {
            document.querySelector('.main-menu').classList.toggle('show');
        });
    </script>
</body>
</html>
