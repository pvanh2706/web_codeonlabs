<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Why Choose Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
       .why-choose-feature {
        font-size: 16px;
        color: #333;
        font-weight: bold;
        text-align: center;
        margin-top: 10px;
    }
    .feature-icon {
        max-width: 80px;
        height: auto;
    }
    .icon-wrapper {
        width: 100px;
        height: 100px;
        display: flex;
        align-items: center;
        justify-content: center;
    }
    @media (max-width: 768px) {
        .why-choose-heading {
            font-size: 24px;
        }
        .why-choose-feature {
            font-size: 14px;
        }
    }
    </style>
</head>
<body>
    <div class="container py-3">
        <div class="row align-items-center why-choose-us">
            <div class="col-lg-6 col-md-12">
                <div class="why-choose-title mb-3 text-center">
                    <p class="why-choose-heading text-primary" style="font-size: 32px; font-weight: bold;">TẠI SAO BẠN NÊN CHỌN CHÚNG TÔI?</p>
                </div>
                <p class="why-choose-content">Chúng tôi tự hào mang đến cho khách hàng những chiến lược marketing chuyên nghiệp, giúp doanh nghiệp đứng vững trên thị trường và giúp cho việc bán sản phẩm trở nên dễ dàng hơn với giá cao hơn</p>
                <div class="row text-center">
                    <div class="col-4 d-flex flex-column align-items-center">
                        <div class="icon-wrapper d-flex align-items-center justify-content-center">
                            <img src="img/tai-sao1.png" alt="Tốc độ & sáng tạo" class="feature-icon">
                        </div>
                        <p class="why-choose-feature">Tốc độ & sáng tạo</p>
                    </div>
                    <div class="col-4 d-flex flex-column align-items-center">
                        <div class="icon-wrapper d-flex align-items-center justify-content-center">
                            <img src="img/tai-sao2.png" alt="An toàn & hiệu quả" class="feature-icon">
                        </div>
                        <p class="why-choose-feature">An toàn & hiệu quả</p>
                    </div>
                    <div class="col-4 d-flex flex-column align-items-center">
                        <div class="icon-wrapper d-flex align-items-center justify-content-center">
                            <img src="img/tai-sao3.png" alt="Giá cả cạnh tranh" class="feature-icon">
                        </div>
                        <p class="why-choose-feature">Giá cả cạnh tranh</p>
                    </div>
                </div>
            </div>
    
            <div class="col-lg-6 col-md-12 text-center">
                <img src="img/why-choose-us.png" alt="Banner" class="img-fluid">
            </div>
        </div>
    </div>
    

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.min.js"></script>
</body>
</html>
