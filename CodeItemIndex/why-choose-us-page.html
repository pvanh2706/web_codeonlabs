<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeOn Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .hero-section {
            position: relative;
            background: url('img/hero-bg.png') no-repeat center center/cover;
            color: white;
            padding: 50px 20px;
            text-align: left;
        }
        .hero-text {
            position: absolute;
            top: 20%;
            left: 10%;
            max-width: 40%;
            font-size: 24px;
            font-weight: bold;
        }
        .highlight {
            font-weight: bold;
        }
        .custom-box {
            padding: 30px;
            font-weight: bold;
            color: white;
            background: #1662D6;
            border-radius: 10px;
        }
        .custom-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Hero Section -->
        <div class="position-relative">
            <img src="img/hero.png" alt="Hero" class="img-fluid w-100">
            <div class="hero-text">
                <p>Hãy để <span class="highlight">CodeOn Labs</span> giúp bạn tạo ra Website giá rẻ, phù hợp và tăng doanh thu cho doanh nghiệp của bạn</p>
            </div>
        </div>
        
        <!-- Feature Section -->
        <div class="container mt-4">
            <div class="row g-3">
                <div class="col-md-6">
                    <img src="img/feature1.png" alt="Feature" class="custom-img">
                </div>
                <div class="col-md-6 d-flex align-items-center">
                    <div class="custom-box w-100 text-center">
                        <h2>Quy trình thiết kế website</h2>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
