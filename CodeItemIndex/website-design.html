<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết Kế Website Độc Quyền</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        /* Đảm bảo nội dung nằm trong container */
.container {
    margin-top: 30px;
}

/* Tiêu đề chính */
.section-title {
    font-size: 48px;
    font-weight: bold;
    color: black;
    margin-top: 20px;
}

/* Mô tả */
.section-description {
    font-size: 20px;
    font-weight: bold;
}

/* Ảnh trang trí */
.section-decor {
    width: 100%;
    max-width: 150px; /* Giới hạn kích thước ảnh */
    object-fit: cover;
}

/* Ảnh chính */
.section-image {
    width: 100%;
    max-width: 500px; /* Giới hạn kích thước ảnh */
    height: auto;
}

/* Responsive cho màn hình nhỏ */
@media (max-width: 768px) {
    .section-title {
        font-size: 32px; /* Giảm kích thước tiêu đề */
    }

    .section-description {
        font-size: 18px;
    }

    .section-image {
        max-width: 100%;
    }
}
    </style>
</head>
<body>

    <div class="container">
        <div class="row align-items-center section-content">
            <!-- Text and Description -->
            <div class="col-lg-5 col-md-12 text-center text-md-start">
                <div class="mb-4">
                    <img src="img/paint-green.png" alt="Decorative Paint" class="section-decor">
                </div>
                <h2 class="section-title">Chúng tôi thiết kế website độc quyền 100%</h2>
                <p class="section-description">
                    Khách hàng hợp tác với CodeOn Labs sẽ được tư vấn từng bước chuyên nghiệp từ phân tích ý tưởng, lập trình web, 
                    thiết kế responsive phiên bản di động, hướng dẫn sử dụng và tối ưu hóa công cụ tìm kiếm.
                </p>
            </div>

            <!-- Image Section -->
            <div class="col-lg-7 col-md-12 text-center">
                <img src="img/tai-sao-chon.png" alt="Why Choose Us" class="section-image">
            </div>
        </div>
    </div>

</body>
</html>
