<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thiết kế Website - CodeOn Labs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            color: white;
        }
        .image-grid {
            width: 150px;
            height: 150px;
            position: relative;
            border-radius: 8px;
            overflow: hidden;
        }
        .image-grid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease-in-out;
        }
        .image-grid .overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.5);
            transition: background 0.3s ease-in-out;
        }
        .image-grid:hover img {
            transform: scale(1.05);
        }
        .image-grid:hover .overlay {
            background: rgba(255, 255, 255, 0.3);
        }
    </style>
</head>
<body>

<div class="container py-5" style="background-color: #0d6efd;;">
    <div class="row align-items-center">
        <div class="col-md-6 d-flex flex-wrap gap-3">
            <div class="image-grid">
                <img src="https://storage.googleapis.com/a1aa/image/rHjfaZAtk8c96i7eagxC4ToIGTjOU4-SpguqRJz-Y6A.jpg" alt="Person thinking">
                <div class="overlay"></div>
            </div>
            <div class="image-grid">
                <img src="https://storage.googleapis.com/a1aa/image/FDqcM9jaDscereZKT0qO-fDH3AUkUx7a1vF8AVgD8xE.jpg" alt="Person smiling">
                <div class="overlay"></div>
            </div>
            <div class="image-grid">
                <img src="https://storage.googleapis.com/a1aa/image/poD6V5ac2j31bR5zvE1RxAt83hVGN56QUeMtp27S_Qg.jpg" alt="Person using phone">
                <div class="overlay"></div>
            </div>
            <div class="image-grid bg-white"></div> <!-- Ô trắng -->
        </div>

        <div class="col-md-6 mt-4 mt-md-0">
            <h1 class="fw-bold display-5">CHÚNG TÔI THIẾT KẾ WEBSITE ĐƠN GIẢN, UY TÍN CHUẨN SEO</h1>
            <p class="fs-5 mt-3">
                Giữa bức tranh đa sắc của thế giới số, CodeOn Labs mang đến những gam màu độc đáo, kiến tạo nên những Website tinh tế, giúp thương hiệu của bạn tỏa sáng giữa hàng triệu đối thủ.
            </p>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
