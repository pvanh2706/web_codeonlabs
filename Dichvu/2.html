<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vì Sao Nên Thiết Kế Website?</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.3/css/all.min.css" rel="stylesheet">
    <style>
        .card-custom {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.1);
            margin-top: 50px;
        }
        .image-container img {
            width: 350px;
            height: 250px;
            object-fit: cover;
            border-radius: 10px;
        }
        .btn-custom {
            background-color: #0d6efd;
            color: white;
            font-weight: bold;
            padding: 10px 20px;
            border-radius: 25px;
            display: flex;
            align-items: center;
            gap: 8px;
            border: none;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 3px 6px rgba(0, 0, 0, 0.2);
        }
        .btn-custom:hover {
            background-color: #0b5ed7;
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.3);
        }
        .icon-chevron {
            font-size: 1.2rem;
        }
        .list-group-item {
            cursor: pointer;
            transition: background 0.3s ease-in-out;
        }
        .list-group-item:hover {
            background: rgba(13, 110, 253, 0.1);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card-custom d-flex flex-column flex-md-row align-items-center gap-4">
        <div class="image-container">
            <img src="https://storage.googleapis.com/a1aa/image/_tNlGGJdzbOPgjctkQCuVJAKKHsTylD94KaD4ATjrpI.jpg" 
                 alt="Person working on a laptop with a colorful donut in hand" 
                 class="img-fluid">
        </div>
        <div>
            <h1 class="text-primary fw-bold">VÌ SAO NÊN THIẾT KẾ WEBSITE?</h1>
            <p class="text-muted">
                Trong kỷ nguyên số đầy sôi động, website chính là cánh cổng mở ra thế giới....
                <span class="text-primary">(Đọc thêm)</span>
            </p>
            <ul class="list-group list-group-flush">
                <li class="list-group-item d-flex justify-content-between align-items-center text-warning fw-bold">
                    TẠO DỰNG THƯƠNG HIỆU
                    <i class="fas fa-chevron-down icon-chevron"></i>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center text-primary fw-bold">
                    TĂNG KHẢ NĂNG TIẾP CẬN
                    <i class="fas fa-chevron-down icon-chevron"></i>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center text-dark fw-bold">
                    TĂNG DOANH THU
                    <i class="fas fa-chevron-down icon-chevron"></i>
                </li>
                <li class="list-group-item d-flex justify-content-between align-items-center text-dark fw-bold">
                    TIẾT KIỆM CHI PHÍ
                    <i class="fas fa-chevron-down icon-chevron"></i>
                </li>
            </ul>
            <button class="btn-custom mt-4">
                Đọc thêm
                <i class="fas fa-arrow-right"></i>
            </button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
